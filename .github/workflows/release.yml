name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 20 ships npm 10.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm publish --tag "${{ github.event.release.prerelease && 'next' || 'latest' }}"
