name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # Node 20 ships npm 10, which has neither trusted publishing nor staged publishing.
      - run: npm install -g npm@11.21.1
      - run: npm ci
      # Staged: the version goes live only when an owner approves it with 2FA (RELEASING.md).
      - run: npm stage publish --tag "${{ github.event.release.prerelease && 'next' || 'latest' }}"
