  -
    name: Geofences
    description: 'Named places, their geometry and the place / ownership taxonomy.'
  -
    name: Shipments
    description: 'Shipments, their stops and their route segments.'
  -
    name: Users
    description: 'Teammates on the account and the devices each of them can see.'
  -
    name: 'Container types'
    description: "The account's own vocabulary of returnable container types, which devices reference by id."
  -
    name: Events
    description: 'Account-wide chronological feed of device events (geofence, alarms, shipment).'
  -
    name: Groups
    description: 'Device groups — fleet organisation, and the unit bulk device access is granted in.'
