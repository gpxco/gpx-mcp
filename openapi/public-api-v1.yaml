openapi: 3.0.3
info:
  title: 'GPX Public API v1'
  description: 'The GPX public API. Every endpoint lives under https://api.gpx.co/v1.'
  version: 1.0.0
servers:
  -
    url: 'https://api.gpx.co'
    description: Production
  -
    url: 'https://api.staging.gpx.co'
    description: Staging
paths:
  /v1/account:
    get:
      summary: 'Show the authenticated account'
      operationId: showTheAuthenticatedAccount
      description: "Returns the account the presented token belongs to, so it also serves as a\ncredential check."
      parameters: []
      responses:
        200:
          description: 'Successful response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiResource'
        401:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        404:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        422:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        429:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        502:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
      tags:
        - Account
    patch:
      summary: 'Update the authenticated account'
      operationId: updateTheAuthenticatedAccount
      description: "Accepts name and the customer-writable settings. Turning tracker_sharing_enabled on\nmakes every device set to public — or inheriting a public default — reachable on an\nunauthenticated URL."
      parameters: []
      responses:
        200:
          description: 'Successful response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiResource'
        401:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        404:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        422:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        429:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        502:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
      tags:
        - Account
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: jcqqqpmcouwcvd
                settings:
                  type: object
                  description: ''
                  example: null
                  properties:
                    tracker_sharing_enabled:
                      type: boolean
                      description: ''
                      example: true
                    tracker_sharing_default:
                      type: string
                      description: ''
                      example: public
                      enum:
                        - public
                        - private
                    shareable_link_logo_mode:
                      type: string
                      description: ''
                      example: default
                      enum:
                        - default
                        - none
                        - custom
                    shareable_link_logo_file_id:
                      type: integer
                      description: ''
                      example: 18
  /v1/devices:
    get:
      summary: 'List devices'
      operationId: listDevices
      description: 'Filterable by name, serial, status and model.'
      parameters:
        -
          in: query
          name: name
          description: 'Partial match on the device name. Must not be greater than 255 characters.'
          example: 'Truck 7'
          required: false
          schema:
            type: string
            description: 'Partial match on the device name. Must not be greater than 255 characters.'
            example: 'Truck 7'
        -
          in: query
          name: serial
          description: 'Exact match. A serial is looked up, not searched. Must not be greater than 255 characters.'
          example: ABC123
          required: false
          schema:
            type: string
            description: 'Exact match. A serial is looked up, not searched. Must not be greater than 255 characters.'
            example: ABC123
        -
          in: query
          name: status
          description: 'A device lifecycle state.'
          example:
            - active
          required: false
          schema:
            type: array
            description: 'A device lifecycle state.'
            example:
              - active
            items:
              type: string
              enum:
                - active
                - provisioned
                - hidden
                - archived
                - replaced
        -
          in: query
          name: model
          description: 'A device model. Must not be greater than 255 characters.'
          example:
            - nt08
          required: false
          schema:
            type: array
            description: 'A device model. Must not be greater than 255 characters.'
            example:
              - nt08
            items:
              type: string
        -
          in: query
          name: include
          description: 'Include telemetry and/or last_position. Comma-separate values. Omitted by default because both are cross-store reads.'
          example:
            - 'telemetry,last_position'
          required: false
          schema:
            type: array
            description: 'Include telemetry and/or last_position. Comma-separate values. Omitted by default because both are cross-store reads.'
            example:
              - 'telemetry,last_position'
            items:
              type: string
              enum:
                - telemetry
                - last_position
        -
          in: query
          name: sort
          description: 'Sort column, prefixed with - for descending.'
          example: '-created_at'
          required: false
          schema:
            type: string
            description: 'Sort column, prefixed with - for descending.'
            example: '-created_at'
            enum:
              - name
              - '-name'
              - serial
              - '-serial'
              - status
              - '-status'
              - created_at
              - '-created_at'
              - updated_at
              - '-updated_at'
        -
          in: query
          name: per_page
          description: 'Results per page. Defaults to 50, capped at 100. Must be at least 1. Must not be greater than 100.'
          example: 50
          required: false
          schema:
            type: integer
            description: 'Results per page. Defaults to 50, capped at 100. Must be at least 1. Must not be greater than 100.'
            example: 50
        -
          in: query
          name: page
          description: 'Page number, starting at 1. Must be at least 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number, starting at 1. Must be at least 1.'
            example: 1
      responses:
        200:
          description: 'Successful response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiCollection'
        401:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        404:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        422:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        429:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        502:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
      tags:
        - Devices
  '/v1/devices/{deviceId}':
    get:
      summary: 'Show a device'
      operationId: showADevice
      description: ''
      parameters:
        -
          in: query
          name: include
          description: 'Include telemetry and/or last_position. Comma-separate values. Omitted by default because both are cross-store reads.'
          example:
            - 'telemetry,last_position'
          required: false
          schema:
            type: array
            description: 'Include telemetry and/or last_position. Comma-separate values. Omitted by default because both are cross-store reads.'
            example:
              - 'telemetry,last_position'
            items:
              type: string
              enum:
                - telemetry
                - last_position
      responses:
        200:
          description: 'Successful response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiResource'
        401:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        404:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        422:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        429:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        502:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
      tags:
        - Devices
    patch:
      summary: 'Update a device'
      operationId: updateADevice
      description: 'Accepts name, note, asset_value, tracker_sharing and container_type_id.'
      parameters: []
      responses:
        200:
          description: 'Successful response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiResource'
        401:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        404:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        422:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        429:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        502:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
      tags:
        - Devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: tdqdrkutsejyeeknigkh
                note:
                  type: string
                  description: ''
                  example: sed
                asset_value:
                  type: integer
                  description: 'Must be at least 0.'
                  example: 51
                tracker_sharing:
                  type: string
                  description: ''
                  example: private
                  enum:
                    - inherit
                    - public
                    - private
                container_type_id:
                  type: integer
                  description: ''
                  example: 18
              required:
                - name
                - tracker_sharing
    parameters:
      -
        in: path
        name: deviceId
        description: ''
        example: 6
        required: true
        schema:
          type: integer
  '/v1/devices/{deviceId}/positions':
    get:
      summary: "List a device's positions"
      operationId: listADevicesPositions
      description: ''
      parameters:
        -
          in: query
          name: location_after
          description: 'Start of the window on the time the device recorded the fix. Defaults to 24 hours before location_before. Must be a valid date.'
          example: '2026-07-02T00:00:00Z'
          required: false
          schema:
            type: string
            description: 'Start of the window on the time the device recorded the fix. Defaults to 24 hours before location_before. Must be a valid date.'
            example: '2026-07-02T00:00:00Z'
        -
          in: query
          name: location_before
          description: 'End of the window on the time the device recorded the fix. Defaults to now. Must be a valid date. Must be a date after or equal to <code>location_after</code>.'
          example: '2026-07-03T00:00:00Z'
          required: false
          schema:
            type: string
            description: 'End of the window on the time the device recorded the fix. Defaults to now. Must be a valid date. Must be a date after or equal to <code>location_after</code>.'
            example: '2026-07-03T00:00:00Z'
        -
          in: query
          name: sort
          description: 'Sort on location_at, prefixed with - for descending.'
          example: '-location_at'
          required: false
          schema:
            type: string
            description: 'Sort on location_at, prefixed with - for descending.'
            example: '-location_at'
            enum:
              - location_at
              - '-location_at'
        -
          in: query
          name: per_page
          description: 'Results per page. Defaults to 50, capped at 100. Must be at least 1. Must not be greater than 100.'
          example: 50
          required: false
          schema:
            type: integer
            description: 'Results per page. Defaults to 50, capped at 100. Must be at least 1. Must not be greater than 100.'
            example: 50
        -
          in: query
          name: page
          description: 'Page number, starting at 1. Must be at least 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number, starting at 1. Must be at least 1.'
            example: 1
      responses:
        200:
          description: 'Successful response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiCollection'
        401:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        404:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        422:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        429:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        502:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
      tags:
        - Devices
    parameters:
      -
        in: path
        name: deviceId
        description: ''
        example: 11
        required: true
        schema:
          type: integer
  '/v1/devices/{deviceId}/events':
    get:
      summary: "List a device's events"
      operationId: listADevicesEvents
      description: 'Same feed as GET /events, scoped to one device. Windowed on event_at.'
      parameters:
        -
          in: query
          name: event_after
          description: 'Start of the window on event_at. Defaults to 24 hours before event_before when both are omitted, or 30 days before event_before when only event_before is set. Must be a valid date.'
          example: '2026-07-02T00:00:00Z'
          required: false
          schema:
            type: string
            description: 'Start of the window on event_at. Defaults to 24 hours before event_before when both are omitted, or 30 days before event_before when only event_before is set. Must be a valid date.'
            example: '2026-07-02T00:00:00Z'
        -
          in: query
          name: event_before
          description: 'End of the window on event_at. Defaults to now when omitted, or 30 days after event_after when only event_after is set. Must be a valid date. Must be a date after or equal to <code>event_after</code>.'
          example: '2026-07-03T00:00:00Z'
          required: false
          schema:
            type: string
            description: 'End of the window on event_at. Defaults to now when omitted, or 30 days after event_after when only event_after is set. Must be a valid date. Must be a date after or equal to <code>event_after</code>.'
            example: '2026-07-03T00:00:00Z'
        -
          in: query
          name: sort
          description: 'Sort on event_at. Prefix with - for descending. Defaults to -event_at.'
          example: '-event_at'
          required: false
          schema:
            type: string
            description: 'Sort on event_at. Prefix with - for descending. Defaults to -event_at.'
            example: '-event_at'
            enum:
              - event_at
              - '-event_at'
        -
          in: query
          name: per_page
          description: 'Results per page. Defaults to 50, capped at 100. Must be at least 1. Must not be greater than 100.'
          example: 50
          required: false
          schema:
            type: integer
            description: 'Results per page. Defaults to 50, capped at 100. Must be at least 1. Must not be greater than 100.'
            example: 50
        -
          in: query
          name: page
          description: 'Page number, starting at 1. Must be at least 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number, starting at 1. Must be at least 1.'
            example: 1
        -
          in: query
          name: geofence_id
          description: 'Restrict to events for one geofence. Must be at least 1.'
          example: 5
          required: false
          schema:
            type: integer
            description: 'Restrict to events for one geofence. Must be at least 1.'
            example: 5
        -
          in: query
          name: shipment_id
          description: 'Restrict to events for one shipment. Must be at least 1.'
          example: 7
          required: false
          schema:
            type: integer
            description: 'Restrict to events for one shipment. Must be at least 1.'
            example: 7
        -
          in: query
          name: event_type
          description: 'Event type (e.g. geofence-exit, alarm-sos, shipment-late). Repeatable. Must not be greater than 128 characters.'
          example:
            - geofence-exit
          required: false
          schema:
            type: array
            description: 'Event type (e.g. geofence-exit, alarm-sos, shipment-late). Repeatable. Must not be greater than 128 characters.'
            example:
              - geofence-exit
            items:
              type: string
      responses: {  }
      tags:
        - Devices
    parameters:
      -
        in: path
        name: deviceId
        description: ''
        example: 12
        required: true
        schema:
          type: integer
  /v1/geofences:
    get:
      summary: 'List geofences'
      operationId: listGeofences
      description: 'Filterable by place_type and ownership_type, each multi-value.'
      parameters:
        -
          in: query
          name: place_type
          description: "A place type slug, standard or one of the account's own. A standard slug also matches its custom types. Up to 100 values."
          example:
            - warehouse
          required: false
          schema:
            type: array
            description: "A place type slug, standard or one of the account's own. A standard slug also matches its custom types. Up to 100 values."
            example:
              - warehouse
            items:
              type: string
        -
          in: query
          name: ownership_type
          description: 'An ownership type.'
          example:
            - owned
          required: false
          schema:
            type: array
            description: 'An ownership type.'
            example:
              - owned
            items:
              type: string
              enum:
                - owned
                - customer
                - supplier
                - 3pl
                - public
        -
          in: query
          name: search
          description: 'Partial match on the geofence name. Must not be greater than 255 characters.'
          example: Depot
          required: false
          schema:
            type: string
            description: 'Partial match on the geofence name. Must not be greater than 255 characters.'
            example: Depot
        -
          in: query
          name: sort
          description: 'Sort column, prefixed with - for descending.'
          example: '-created_at'
          required: false
          schema:
            type: string
            description: 'Sort column, prefixed with - for descending.'
            example: '-created_at'
            enum:
              - name
              - '-name'
              - created_at
              - '-created_at'
              - updated_at
              - '-updated_at'
        -
          in: query
          name: per_page
          description: 'Results per page. Defaults to 50, capped at 100. Must be at least 1. Must not be greater than 100.'
          example: 50
          required: false
          schema:
            type: integer
            description: 'Results per page. Defaults to 50, capped at 100. Must be at least 1. Must not be greater than 100.'
            example: 50
        -
          in: query
          name: page
          description: 'Page number, starting at 1. Must be at least 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number, starting at 1. Must be at least 1.'
            example: 1
      responses:
        200:
          description: 'Successful response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiCollection'
        401:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        404:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        422:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        429:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        502:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
      tags:
        - Geofences
    post:
      summary: 'Create a geofence'
      operationId: createAGeofence
      description: "Requires a location: latitude + longitude + radius_meters, or a geojson\nPolygon / MultiPolygon whose rings are closed."
      parameters: []
      responses:
        201:
          description: 'Successful response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiResource'
        401:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        404:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        422:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        429:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        502:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
      tags:
        - Geofences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: uoqeg
                alerting:
                  type: boolean
                  description: ''
                  example: false
                latitude:
                  type: number
                  description: 'Must be at least -90. Must not be greater than 90.'
                  example: 25
                longitude:
                  type: number
                  description: 'Must be at least -180. Must not be greater than 180.'
                  example: 11
                radius_meters:
                  type: number
                  description: 'Must be at least 0.'
                  example: 41
                geojson:
                  type: object
                  description: ''
                  example: null
                  properties:
                    type:
                      type: string
                      description: 'This field is required when <code>geojson</code> is present.'
                      example: voluptates
                min_assets:
                  type: integer
                  description: 'Must be at least 0. Must not be greater than 500.'
                  example: 15
                max_assets:
                  type: integer
                  description: 'Must be at least 0. Must not be greater than 500.'
                  example: 25
                allowable_dwell_seconds:
                  type: integer
                  description: 'Must be at least 0. Must not be greater than 43200000.'
                  example: 23
                place_type:
                  type: string
                  description: "A place type slug, standard or one of the account's own custom types. See the place types endpoints."
                  example: warehouse
                ownership_type:
                  type: string
                  description: ''
                  example: public
                  enum:
                    - owned
                    - customer
                    - supplier
                    - 3pl
                    - public
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: fuzmestyzhifxjj
              required:
                - name
  '/v1/geofences/{geofenceId}':
    get:
      summary: 'Show a geofence'
      operationId: showAGeofence
      description: ''
      parameters: []
      responses:
        200:
          description: 'Successful response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiResource'
        401:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        404:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        422:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        429:
          description: 'The request could not be processed.'
          content:
