    name: 'Place types'
    description: "The GPX standard place types, plus the account's own custom types, each under a standard parent. A geofence's place_type is one of these slugs."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Tokens are provisioned by GPX. Contact support to have one issued for your account.'
  schemas:
    PublicApiResource:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: true
    PublicApiCollection:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          type: object
          additionalProperties: true
        links:
          type: object
          additionalProperties: true
    PublicApiError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties: true
    ShipmentStopInput:
      type: object
      required:
        - sequence
        - location_type
      properties:
        sequence:
          type: integer
          minimum: 0
          description: 'Position in the itinerary. Unique within the shipment; the lowest is the origin and the highest the destination.'
          example: 0
        location_type:
          type: string
          enum:
            - circle
            - geofence
          description: '`geofence` stops at an existing geofence; `circle` stops within `radius_meters` of `center`.'
          example: circle
        name:
          type: string
          nullable: true
          description: 'Label shown for the stop.'
          example: 'Chicago DC'
        geofence_id:
          type: integer
          nullable: true
          description: 'Required for a `geofence` stop. A geofence id from `list_geofences`.'
          example: null
        center:
          type: object
          nullable: true
          description: 'Required for a `circle` stop.'
          properties:
            latitude:
              type: number
              format: double
              example: 41.8781
            longitude:
              type: number
              format: double
              example: -87.6298
        radius_meters:
          type: integer
          minimum: 50
          maximum: 10000
          nullable: true
          description: 'Required for a `circle` stop. Radius around `center`, in metres.'
          example: 250
security:
  -
    default: []
