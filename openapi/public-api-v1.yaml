openapi: 3.0.3
info:
  title: 'GPX Public API v1'
  description: 'The GPX public API. Every endpoint lives under https://api.gpx.co/v1.'
  version: 1.0.0
servers:
  -
    url: 'https://api.gpx.co'
    description: Production
  -
    url: 'https://api.staging.gpx.co'
    description: Staging
paths:
  /v1/account:
    get:
      summary: 'Show the authenticated account'
      operationId: get_account
      description: "Returns the account the presented token belongs to, so it also serves as a\ncredential check."
      parameters: []
      responses:
        200:
          description: 'Successful response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiResource'
        401:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        404:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        422:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        429:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        502:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
      tags:
        - Account
    patch:
      summary: 'Update the authenticated account'
      operationId: update_account
      description: "Accepts name and the customer-writable settings. Turning tracker_sharing_enabled on\nmakes every device set to public — or inheriting a public default — reachable on an\nunauthenticated URL."
      parameters: []
      responses:
        200:
          description: 'Successful response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiResource'
        401:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        404:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        422:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        429:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        502:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
      tags:
        - Account
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'The account name. Must not be greater than 255 characters.'
                  example: 'Acme Logistics'
                settings:
                  type: object
                  description: 'Settings to change, keyed by code. Writable codes: learned_routes_available, tracker_sharing_enabled, tracker_sharing_default, shareable_link_logo_mode, shareable_link_logo_file_id, auto_archive_devices_on_shipment_completion, default_stop_radius_origin, default_stop_radius_destination, default_stop_radius_waypoint, default_route_corridor_buffer, default_geofence_alert_on_enter_exit, default_geofence_max_dwell_days, default_geofence_max_assets, default_geofence_min_assets. Any other code is a 422.'
                  example:
                    tracker_sharing_default: private
                  properties:
                    tracker_sharing_enabled:
                      type: boolean
                      description: 'Allow public sharing links. On, every device set to public, or inheriting a public default, can be viewed without signing in.'
                      example: false
                    tracker_sharing_default:
                      type: string
                      description: 'The sharing a device set to `inherit` takes.'
                      example: private
                      enum:
                        - public
                        - private
                    shareable_link_logo_mode:
                      type: string
                      description: "The logo on shared tracking pages: the GPX logo, none, or the account's own."
                      example: default
                      enum:
                        - default
                        - none
                        - custom
                    shareable_link_logo_file_id:
                      type: integer
                      description: 'The uploaded logo file for the `custom` logo mode.'
                      example: 3301
  /v1/devices:
    get:
      summary: 'List devices'
      operationId: list_devices
      description: "Lists the account's tracking devices, filterable by name, serial, status and model. Use it to find a\ndevice id; `include=last_position` adds where each device is now."
      parameters:
        -
          in: query
          name: name
          description: 'Partial match on the device name. Must not be greater than 255 characters.'
          example: 'Truck 7'
          required: false
          schema:
            type: string
            description: 'Partial match on the device name. Must not be greater than 255 characters.'
            example: 'Truck 7'
        -
          in: query
          name: serial
          description: 'Exact match. A serial is looked up, not searched. Must not be greater than 255 characters.'
          example: ABC123
          required: false
          schema:
            type: string
            description: 'Exact match. A serial is looked up, not searched. Must not be greater than 255 characters.'
            example: ABC123
        -
          in: query
          name: status
          description: 'A device lifecycle state.'
          example:
            - active
          required: false
          schema:
            type: array
            description: 'A device lifecycle state.'
            example:
              - active
            items:
              type: string
              enum:
                - active
                - provisioned
                - hidden
                - archived
                - replaced
        -
          in: query
          name: model
          description: 'A device model. Must not be greater than 255 characters.'
          example:
            - nt08
          required: false
          schema:
            type: array
            description: 'A device model. Must not be greater than 255 characters.'
            example:
              - nt08
            items:
              type: string
        -
          in: query
          name: include
          description: 'Include telemetry and/or last_position. Comma-separate values. Omitted by default because both are cross-store reads.'
          example:
            - 'telemetry,last_position'
          required: false
          schema:
            type: array
            description: 'Include telemetry and/or last_position. Comma-separate values. Omitted by default because both are cross-store reads.'
            example:
              - 'telemetry,last_position'
            items:
              type: string
              enum:
                - telemetry
                - last_position
        -
          in: query
          name: sort
          description: 'Sort column, prefixed with - for descending.'
          example: '-created_at'
          required: false
          schema:
            type: string
            description: 'Sort column, prefixed with - for descending.'
            example: '-created_at'
            enum:
              - name
              - '-name'
              - serial
              - '-serial'
              - status
              - '-status'
              - created_at
              - '-created_at'
              - updated_at
              - '-updated_at'
        -
          in: query
          name: per_page
          description: 'Results per page. Defaults to 50, capped at 100. Must be at least 1. Must not be greater than 100.'
          example: 50
          required: false
          schema:
            type: integer
            description: 'Results per page. Defaults to 50, capped at 100. Must be at least 1. Must not be greater than 100.'
            example: 50
        -
          in: query
          name: page
          description: 'Page number, starting at 1. Must be at least 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number, starting at 1. Must be at least 1.'
            example: 1
      responses:
        200:
          description: 'Successful response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiCollection'
        401:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        404:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        422:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        429:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        502:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
      tags:
        - Devices
  '/v1/devices/{deviceId}':
    get:
      summary: 'Show a device'
      operationId: get_device
      description: "Returns one device with its status, sharing link and container type. `include=last_position` adds\nwhere it is now, and `include=telemetry` its battery, speed and whether it is moving."
      parameters:
        -
          in: query
          name: include
          description: 'Include telemetry and/or last_position. Comma-separate values. Omitted by default because both are cross-store reads.'
          example:
            - 'telemetry,last_position'
          required: false
          schema:
            type: array
            description: 'Include telemetry and/or last_position. Comma-separate values. Omitted by default because both are cross-store reads.'
            example:
              - 'telemetry,last_position'
            items:
              type: string
              enum:
                - telemetry
                - last_position
      responses:
        200:
          description: 'Successful response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiResource'
        401:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        404:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        422:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        429:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        502:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
      tags:
        - Devices
    patch:
      summary: 'Update a device'
      operationId: update_device
      description: "Changes a device's name, note, asset value, sharing or container type. Only the fields sent change."
      parameters: []
      responses:
        200:
          description: 'Successful response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiResource'
        401:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        404:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        422:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        429:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        502:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
      tags:
        - Devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'The device name. Must not be greater than 255 characters.'
                  example: 'Trailer 42'
                note:
                  type: string
                  description: 'Free-text note. Null clears it.'
                  example: 'Mounted under the rear axle.'
                asset_value:
                  type: integer
                  description: 'Value of what the device tracks, in whole dollars. Null clears it. Must be at least 0.'
                  example: 25000
                tracker_sharing:
                  type: string
                  description: '`public` makes the device viewable on its sharing link, `private` hides it, `inherit` follows the account default.'
                  example: inherit
                  enum:
                    - inherit
                    - public
                    - private
                container_type_id:
                  type: integer
                  description: 'A container type id from `list_container_types`. Null removes the type.'
                  example: 7
              required:
                - name
                - tracker_sharing
    parameters:
      -
        in: path
        name: deviceId
        description: 'The device id, from `list_devices`.'
        example: 48213
        required: true
        schema:
          type: integer
  '/v1/devices/{deviceId}/positions':
    get:
      summary: "List a device's positions"
      operationId: list_device_positions
      description: "Returns the positions a device recorded within a time window, 24 hours by default. Use it for where\na device has been; for where it is now, use `get_device` with `include=last_position`."
      parameters:
        -
          in: query
          name: location_after
          description: 'Start of the window on the time the device recorded the fix. Defaults to 24 hours before location_before. Must be a valid date.'
          example: '2026-07-02T00:00:00Z'
          required: false
          schema:
            type: string
            description: 'Start of the window on the time the device recorded the fix. Defaults to 24 hours before location_before. Must be a valid date.'
            example: '2026-07-02T00:00:00Z'
        -
          in: query
          name: location_before
          description: 'End of the window on the time the device recorded the fix. Defaults to now. Must be a valid date. Must be a date after or equal to <code>location_after</code>.'
          example: '2026-07-03T00:00:00Z'
          required: false
          schema:
            type: string
            description: 'End of the window on the time the device recorded the fix. Defaults to now. Must be a valid date. Must be a date after or equal to <code>location_after</code>.'
            example: '2026-07-03T00:00:00Z'
        -
          in: query
          name: sort
          description: 'Sort on location_at, prefixed with - for descending.'
          example: '-location_at'
          required: false
          schema:
            type: string
            description: 'Sort on location_at, prefixed with - for descending.'
            example: '-location_at'
            enum:
              - location_at
              - '-location_at'
        -
          in: query
          name: per_page
          description: 'Results per page. Defaults to 50, capped at 100. Must be at least 1. Must not be greater than 100.'
          example: 50
          required: false
          schema:
            type: integer
            description: 'Results per page. Defaults to 50, capped at 100. Must be at least 1. Must not be greater than 100.'
            example: 50
        -
          in: query
          name: page
          description: 'Page number, starting at 1. Must be at least 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number, starting at 1. Must be at least 1.'
            example: 1
      responses:
        200:
          description: 'Successful response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiCollection'
        401:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        404:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        422:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        429:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        502:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
      tags:
        - Devices
    parameters:
      -
        in: path
        name: deviceId
        description: 'The device id, from `list_devices`.'
        example: 48213
        required: true
        schema:
          type: integer
  '/v1/devices/{deviceId}/events':
    get:
      summary: "List a device's events"
      operationId: list_device_events
      description: "Returns one device's events (geofence enters and exits, alarms, shipment events) within a time\nwindow: the `list_events` feed, scoped to one device."
      parameters:
        -
          in: query
          name: event_after
          description: 'Start of the window on event_at. Defaults to 24 hours before event_before when both are omitted, or 30 days before event_before when only event_before is set. Must be a valid date.'
          example: '2026-07-02T00:00:00Z'
          required: false
          schema:
            type: string
            description: 'Start of the window on event_at. Defaults to 24 hours before event_before when both are omitted, or 30 days before event_before when only event_before is set. Must be a valid date.'
            example: '2026-07-02T00:00:00Z'
        -
          in: query
          name: event_before
          description: 'End of the window on event_at. Defaults to now when omitted, or 30 days after event_after when only event_after is set. Must be a valid date. Must be a date after or equal to <code>event_after</code>.'
          example: '2026-07-03T00:00:00Z'
          required: false
          schema:
            type: string
            description: 'End of the window on event_at. Defaults to now when omitted, or 30 days after event_after when only event_after is set. Must be a valid date. Must be a date after or equal to <code>event_after</code>.'
            example: '2026-07-03T00:00:00Z'
        -
          in: query
          name: sort
          description: 'Sort on event_at. Prefix with - for descending. Defaults to -event_at.'
          example: '-event_at'
          required: false
          schema:
            type: string
            description: 'Sort on event_at. Prefix with - for descending. Defaults to -event_at.'
            example: '-event_at'
            enum:
              - event_at
              - '-event_at'
        -
          in: query
          name: per_page
          description: 'Results per page. Defaults to 50, capped at 100. Must be at least 1. Must not be greater than 100.'
          example: 50
          required: false
          schema:
            type: integer
            description: 'Results per page. Defaults to 50, capped at 100. Must be at least 1. Must not be greater than 100.'
            example: 50
        -
          in: query
          name: page
          description: 'Page number, starting at 1. Must be at least 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number, starting at 1. Must be at least 1.'
            example: 1
        -
          in: query
          name: geofence_id
          description: 'Restrict to events for one geofence. Must be at least 1.'
          example: 5
          required: false
          schema:
            type: integer
            description: 'Restrict to events for one geofence. Must be at least 1.'
            example: 5
        -
          in: query
          name: shipment_id
          description: 'Restrict to events for one shipment. Must be at least 1.'
          example: 7
          required: false
          schema:
            type: integer
            description: 'Restrict to events for one shipment. Must be at least 1.'
            example: 7
        -
          in: query
          name: event_type
          description: 'Event type (e.g. geofence-exit, alarm-sos, shipment-late). Repeatable. Must not be greater than 128 characters.'
          example:
            - geofence-exit
          required: false
          schema:
            type: array
            description: 'Event type (e.g. geofence-exit, alarm-sos, shipment-late). Repeatable. Must not be greater than 128 characters.'
            example:
              - geofence-exit
            items:
              type: string
      responses:
        200:
          description: 'Successful response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiCollection'
        401:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        404:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        422:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        429:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        502:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
      tags:
        - Devices
    parameters:
      -
        in: path
        name: deviceId
        description: 'The device id, from `list_devices`.'
        example: 48213
        required: true
        schema:
          type: integer
  /v1/geofences:
    get:
      summary: 'List geofences'
      operationId: list_geofences
      description: "Lists the account's geofences, the named places devices enter and leave. Filterable by place type\nand ownership type, each multi-value."
      parameters:
        -
          in: query
          name: place_type
          description: "A place type slug, standard or one of the account's own. A standard slug also matches its custom types. Up to 100 values."
          example:
            - warehouse
          required: false
          schema:
            type: array
            description: "A place type slug, standard or one of the account's own. A standard slug also matches its custom types. Up to 100 values."
            example:
              - warehouse
            items:
              type: string
        -
          in: query
          name: ownership_type
          description: 'An ownership type.'
          example:
            - owned
          required: false
          schema:
            type: array
            description: 'An ownership type.'
            example:
              - owned
            items:
              type: string
              enum:
                - owned
                - customer
                - supplier
                - 3pl
                - public
        -
          in: query
          name: search
          description: 'Partial match on the geofence name. Must not be greater than 255 characters.'
          example: Depot
          required: false
          schema:
            type: string
            description: 'Partial match on the geofence name. Must not be greater than 255 characters.'
            example: Depot
        -
          in: query
          name: sort
          description: 'Sort column, prefixed with - for descending.'
          example: '-created_at'
          required: false
          schema:
            type: string
            description: 'Sort column, prefixed with - for descending.'
            example: '-created_at'
            enum:
              - name
              - '-name'
              - created_at
              - '-created_at'
              - updated_at
              - '-updated_at'
        -
          in: query
          name: per_page
          description: 'Results per page. Defaults to 50, capped at 100. Must be at least 1. Must not be greater than 100.'
          example: 50
          required: false
          schema:
            type: integer
            description: 'Results per page. Defaults to 50, capped at 100. Must be at least 1. Must not be greater than 100.'
            example: 50
        -
          in: query
          name: page
          description: 'Page number, starting at 1. Must be at least 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number, starting at 1. Must be at least 1.'
            example: 1
      responses:
        200:
          description: 'Successful response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiCollection'
        401:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        404:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        422:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        429:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        502:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
      tags:
        - Geofences
    post:
      summary: 'Create a geofence'
      operationId: create_geofence
      description: "Requires a location: latitude + longitude + radius_meters, or a geojson\nPolygon / MultiPolygon whose rings are closed."
      parameters: []
      responses:
        201:
          description: 'Successful response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiResource'
        401:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        404:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        422:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        429:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        502:
          description: 'The request could not be processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
      tags:
        - Geofences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
