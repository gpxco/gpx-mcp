components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Tokens are provisioned by GPX. Contact support to have one issued for your account.'
  schemas:
    PublicApiResource:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: true
    PublicApiCollection:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          type: object
          additionalProperties: true
        links:
          type: object
          additionalProperties: true
    PublicApiError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties: true
    ShipmentStopInput:
      type: object
      required:
        - sequence
        - location_type
      properties:
        sequence:
          type: integer
          minimum: 0
          example: 0
        location_type:
          type: string
          enum:
            - circle
            - geofence
        name:
          type: string
          nullable: true
        geofence_id:
          type: integer
          nullable: true
        center:
          type: object
          nullable: true
          properties:
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
        radius_meters:
          type: integer
          minimum: 50
          maximum: 10000
          nullable: true
security:
  -
    default: []
