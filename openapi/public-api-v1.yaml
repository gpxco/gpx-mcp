            example: '2026-07-02T00:00:00Z'
        -
          in: query
          name: event_before
          description: 'End of the window on event_at. Defaults to now when omitted, or 30 days after event_after when only event_after is set. Must be a valid date. Must be a date after or equal to <code>event_after</code>.'
          example: '2026-07-03T00:00:00Z'
          required: false
          schema:
            type: string
            description: 'End of the window on event_at. Defaults to now when omitted, or 30 days after event_after when only event_after is set. Must be a valid date. Must be a date after or equal to <code>event_after</code>.'
