      summary: 'Create a custom place type'
      operationId: createACustomPlaceType
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Place types'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "Unique within the account, ignoring case, and never a standard type's name. Must not be greater than 255 characters."
                  example: 'Pediatric Clinic'
                slug:
                  type: string
                  description: 'Defaults to the name in snake case. Lowercase words joined by underscores. Unique within the account and never a standard slug. Fixed once any geofence uses the type. Must match the regex /^[a-z0-9]+(_[a-z0-9]+)*$/. Must not be greater than 64 characters.'
                  example: pediatric_clinic
                parent:
                  type: string
                  description: 'Slug of the standard place type this one rolls up to.'
                  example: demo_location
              required:
                - name
                - slug
                - parent
