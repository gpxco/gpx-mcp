            example: '2026-07-02T00:00:00Z'
        -
          in: query
          name: event_before
          description: 'End of the window on event_at. Defaults to now when omitted, or 30 days after event_after when only event_after is set. Must be a valid date. Must be a date after or equal to <code>event_after</code>.'
          example: '2026-07-03T00:00:00Z'
          required: false
          schema:
            type: string
            description: 'End of the window on event_at. Defaults to now when omitted, or 30 days after event_after when only event_after is set. Must be a valid date. Must be a date after or equal to <code>event_after</code>.'
            example: '2026-07-03T00:00:00Z'
        -
          in: query
          name: sort
          description: 'Sort on event_at. Prefix with - for descending. Defaults to -event_at.'
          example: '-event_at'
          required: false
          schema:
            type: string
            description: 'Sort on event_at. Prefix with - for descending. Defaults to -event_at.'
            example: '-event_at'
            enum:
              - event_at
              - '-event_at'
        -
          in: query
          name: per_page
          description: 'Results per page. Defaults to 50, capped at 100. Must be at least 1. Must not be greater than 100.'
          example: 50
          required: false
          schema:
            type: integer
            description: 'Results per page. Defaults to 50, capped at 100. Must be at least 1. Must not be greater than 100.'
            example: 50
        -
          in: query
          name: page
          description: 'Page number, starting at 1. Must be at least 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number, starting at 1. Must be at least 1.'
            example: 1
        -
